<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>~/ jayesh — Terminal Resume</title>
  <meta name="description" content="Interactive terminal resume of Jayesh Kumar Rawal — AI & Data Science Engineer." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&family=Caveat:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="neo-styles.css" />
  <style>
    body { background: var(--bg); }
    .cursor-fx { background: var(--green); }
  </style>
</head>
<body>
  <div class="cursor-fx" aria-hidden="true"></div>

  <header class="nav">
    <a class="nav-logo" href="index.html"><span class="logo-box">JR</span></a>
    <nav class="nav-links">
      <a href="index.html">Portfolio</a>
      <a href="index.html#projects">Projects</a>
      <a href="index.html#contact" class="nav-cta">Get in Touch!</a>
    </nav>
  </header>

  <main class="term-wrap">
    <div class="terminal">
      <div class="term-bar">
        <span class="term-dot r"></span>
        <span class="term-dot y"></span>
        <span class="term-dot g"></span>
        <span class="term-title">jayesh@codeby-jayesh: ~/resume</span>
      </div>
      <div class="term-body" id="term-body">
        <div class="line">Welcome to <span class="c-yellow">jayesh</span>'s interactive terminal resume.</div>
        <div class="line">Type <span class="c-cyan">help</span> to see available commands.</div>
        <div class="line">&nbsp;</div>
        <div class="line term-input"><span class="prompt">&gt;</span><input id="term-cmd" type="text" autofocus autocomplete="off" spellcheck="false" /></div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p class="footer-copy">© 2026 Jayesh Kumar Rawal · <a href="index.html" style="color:var(--cyan)">← back to portfolio</a></p>
  </footer>

  <script>
    (function () {
      const body = document.getElementById("term-body");
      const input = document.getElementById("term-cmd");
      const promptLine = body.querySelector(".term-input");

      const data = {
        help: [
          "<span class='c-cyan'>help</span>       - show this message",
          "<span class='c-cyan'>whoami</span>     - who is Jayesh",
          "<span class='c-cyan'>skills</span>     - tech stack",
          "<span class='c-cyan'>projects</span>   - featured projects",
          "<span class='c-cyan'>contact</span>    - how to reach me",
          "<span class='c-cyan'>socials</span>    - links",
          "<span class='c-cyan'>clear</span>      - clear screen",
          "<span class='c-cyan'>exit</span>       - goto portfolio",
        ],
        whoami: "Jayesh Kumar Rawal. AI &amp; Data Science Engineer.\nB.Tech CSE (AI &amp; DS) @ Poornima University, Jaipur \u00b7 2024-2028 \u00b7 CGPA 7.0",
        skills: "AI/ML: Scikit-learn \u00b7 Pandas \u00b7 NumPy \u00b7 Streamlit\nCV: OpenCV \u00b7 DeepFace \u00b7 Age/Gender Detection\nBackend: Flask \u00b7 REST APIs \u00b7 Docker \u00b7 Linux \u00b7 Render\nLanguages: Python \u00b7 Java \u00b7 C \u00b7 JavaScript \u00b7 SQL \u00b7 HTML/CSS",
        projects:
          "1. Gaze - AI Face Analysis (Flask + DeepFace + OpenCV)\n   https://github.com/codeby-jayesh/first\n2. Placement Predictor (Pandas + Scikit-learn + Streamlit)\n   https://github.com/codeby-jayesh/College-placement-project\n3. This Portfolio (pure HTML/CSS/JS)\n   https://github.com/codeby-jayesh/codeby-jayesh.github.io",
        contact:
          "Email: 2024btechaidsjayesh17169@poornima.edu.in\nOpen to internships &amp; collaborations.",
        socials:
          "GitHub: https://github.com/codeby-jayesh\nLinkedIn: https://www.linkedin.com/in/codeby-jayesh\nPortfolio: https://codeby-jayesh.github.io",
        unknown: "command not found. Type <span class='c-cyan'>help</span>.",
      };

      function render(lines) {
        lines.forEach((line) => {
          const div = document.createElement("div");
          div.className = "line";
          div.innerHTML = line;
          body.insertBefore(div, promptLine);
        });
        body.scrollTop = body.scrollHeight;
      }

      input.addEventListener("keydown", function (e) {
        if (e.key !== "Enter") return;
        e.preventDefault();
        const cmd = input.value.trim().toLowerCase();
        render([
          "<span class='prompt'>&gt;</span> <span class='c-cyan'>" +
            input.value.replace(/[<>&]/g, "") +
            "</span>",
        ]);
        input.value = "";

        if (cmd === "clear") {
          body.querySelectorAll(".line:not(.term-input)").forEach((n) => n.remove());
          return;
        }
        if (cmd === "exit") {
          window.location.href = "index.html";
          return;
        }
        const out = data[cmd] || data.unknown;
        render([out]);
      });

      document.addEventListener("mousemove", function (e) {
        const fx = document.querySelector(".cursor-fx");
        if (fx) fx.style.transform = "translate(" + (e.clientX - 7) + "px, " + (e.clientY - 7) + "px)";
      });
      setTimeout(function () {
        render([
          "Type <span class='c-cyan'>help</span> to get started. Example: <span class='c-cyan'>projects</span>",
        ]);
      }, 400);
    })();
  </script>
</body>
</html>
